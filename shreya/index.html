<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For Arshiya 🌸</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Cormorant+Garamond:ital,wght@1,500&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--pink:#ffd6e0;--rose:#ff8fab;--deep:#c9184a;--cream:#fff5f0;--gold:#ffd27d;--ink:#5a2a3a;
--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#2a0a18;font-family:Poppins,sans-serif;color:var(--cream)}
.scene{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;opacity:0;transition:opacity .8s;padding:calc(var(--sat) + 16px) 16px calc(var(--sab) + 16px);text-align:center;backdrop-filter:blur(2px)}
.scene::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at top,rgba(255,255,255,.12),transparent 40%);pointer-events:none}
.scene.on{display:flex}.scene.show{opacity:1}
#s1{background:#d7c8a5;color:#4e2a1f;display:flex;align-items:center;justify-content:center;padding:28px 18px 40px}
#s2{background:linear-gradient(#0b0b2e,#3a1c5a 70%,#7a2f6a)}
#s3{background:linear-gradient(#ffe3ec,#ffb3c8)}
#s4{background:#000;padding:0}
#s5,#s6{background:linear-gradient(#ffe9f0,#ffd0dd 60%,#bde5a8 60%)}
#s7{background:radial-gradient(circle,#7a1f45,#2a0a18)}
#s8{background:linear-gradient(#ffe9f0,#ffc2d4)}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px}
.pk{background:#fff;border:3px solid #ffb3c8;border-radius:20px;padding:12px 22px;cursor:pointer;box-shadow:0 6px 16px #c9184a33;transition:transform .2s;color:var(--ink);font:500 15px Poppins}
.pk b{display:block;font-size:46px;font-weight:400}.pk:active{transform:scale(.92)}
#dm{width:150px;height:200px;overflow:visible;animation:dance .8s ease-in-out infinite alternate}
#dm line,#dm .o{stroke:#ffd6e0;stroke-width:5;stroke-linecap:round;fill:none}
@keyframes dance{from{transform:rotate(-7deg) translateY(0)}to{transform:rotate(7deg) translateY(-14px)}}
.dA,.dB{transform-origin:90px 105px;animation:armA .4s ease-in-out infinite alternate}.dB{animation-direction:alternate-reverse}
@keyframes armA{from{transform:rotate(-40deg)}to{transform:rotate(60deg)}}
.dL,.dR{transform-origin:90px 170px;animation:leg .4s ease-in-out infinite alternate}.dR{animation-direction:alternate-reverse}
@keyframes leg{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
#no{transition:transform .25s}
#b7{display:none;position:relative;background:#fff;color:var(--ink);font:700 clamp(19px,5vw,24px)/1.25 Caveat,cursive;padding:12px 18px;border-radius:20px;border:3px solid var(--ink);max-width:90%;margin-bottom:22px}
#b7:after{content:"";position:absolute;bottom:-17px;left:50%;margin-left:-12px;border:11px solid transparent;border-top:17px solid var(--ink)}
#b7.pop{display:block;animation:pop .45s cubic-bezier(.3,1.8,.5,1)}
#dm.nerv{animation:nerv .12s linear infinite alternate}
@keyframes nerv{from{transform:translateX(-4px)}to{transform:translateX(4px)}}
.poem{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:clamp(24px,6vw,40px);line-height:1.4;max-width:620px}
.hand{font-family:Caveat,cursive}
h1{font-family:Caveat,cursive;font-size:clamp(34px,9vw,56px);line-height:1.1;margin-bottom:22px;text-shadow:0 0 20px #ff8fab88}
#s1 .preview-shell{width:min(92vw,860px);max-width:860px}
#s1 .topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:20px}
#s1 .nav-pill{border:none;border-radius:999px;background:#f4f1eb;color:#3c1f1a;box-shadow:0 4px 8px rgba(60,31,26,.12);font:700 18px Poppins;padding:12px 20px;display:flex;align-items:center;justify-content:center;min-width:132px}
#s1 .nav-pill.back-pill{font-size:clamp(18px,3vw,22px);padding:14px 22px;border-radius:32px;min-width:140px;justify-content:flex-start}
#s1 .preview-tag{background:#4e2c1d;color:#f7efe6;border-radius:999px;padding:12px 16px;font:800 20px Poppins;letter-spacing:2px;text-transform:uppercase;box-shadow:0 4px 10px rgba(78,44,29,.18)}
#s1 .speaker{width:52px;height:52px;border-radius:50%;border:0;background:#f5efe8;color:#49342c;font-size:26px;box-shadow:0 6px 12px rgba(60,31,26,.12)}
#s1 .mail-card{position:relative;background:#f6f1e8;border-radius:18px;border:1px solid rgba(90,66,50,.12);box-shadow:0 8px 14px rgba(60,31,26,.1);padding:28px 28px 22px;margin:0 auto;overflow:hidden}
#s1 .mail-row{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;padding:8px 6px 10px}
#s1 .to-wrap{flex:1}
#s1 .small-label{font:600 28px "Cormorant Garamond",serif;letter-spacing:3px;color:#5e3522;opacity:.8;margin-bottom:6px}
#s1 #t1{font-family:"Caveat",cursive;display:inline-block;font-size:clamp(52px,8vw,96px);line-height:0.95;margin:0;color:#5e3522;text-shadow:none;border-bottom:2px solid rgba(81,41,24,.7);padding-bottom:10px;width:100%;margin-bottom:14px;text-align:left}
#s1 .stamp-wrap{display:flex;align-items:center;justify-content:center;padding-top:8px}
#s1 .stamp{width:120px;height:120px;border:4px solid rgba(94,53,34,.7);border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 20px Poppins;color:#5e3522;transform:rotate(18deg);text-transform:uppercase;letter-spacing:2px;position:relative}
#s1 .stamp:before{content:"";position:absolute;inset:10px;border-radius:50%;border:2px solid rgba(94,53,34,.6)}
#s1 .divider{height:1px;background:rgba(94,53,34,.45);margin:16px 0}
#s1 .message-block{padding:18px 6px 6px}
#s1 .message{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:clamp(24px,4vw,38px);line-height:1.2;color:#4e2a1f;max-width:90%}
#s1 .signature{font-family:"Caveat",cursive;font-size:clamp(42px,6vw,74px);color:#4e2a1f;text-align:right;padding-top:18px;margin-right:4px}
#s1 .gift{position:absolute;top:46px;right:24px;width:128px;height:128px;margin:0;filter:none;transform:rotate(3deg)}
#s1 .gift .base{left:12px;right:12px;height:78px}
#s1 .gift .lid{top:30px;height:36px}
#s1 .btn{font:500 16px Poppins;padding:14px 28px;border:0;border-radius:40px;background:linear-gradient(135deg,#ff8fab,#c9184a);color:#fff;box-shadow:0 8px 24px #c9184a66;cursor:pointer;transition:transform .2s,box-shadow .2s,filter .2s}
#s1 #unwrap{display:block;width:min(90%,560px);margin:26px auto 0;background:linear-gradient(135deg,#7a1d2d,#4d0c1a);border-radius:32px;padding:22px 36px;font:700 28px Poppins;letter-spacing:.2px;border:0;box-shadow:0 10px 18px rgba(76,12,23,.22)}
#s1 #unwrap:hover{transform:translateY(-2px)}
.btn:hover{transform:translateY(-2px);filter:saturate(1.08);box-shadow:0 12px 28px #c9184a66}
.btn:active{transform:scale(.94)}.btn.ghost{background:#ffffff22;box-shadow:none;border:1px solid #fff6}
#loader{position:fixed;inset:0;z-index:50;background:#2a0a18;display:flex;align-items:center;justify-content:center;font:700 34px Caveat;transition:opacity .8s}
#mute{position:fixed;top:calc(var(--sat) + 10px);right:10px;z-index:40;width:40px;height:40px;border-radius:50%;border:0;background:#ffffff33;color:#fff;font-size:18px;display:none}
#petals{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
.petal{position:absolute;top:-30px;animation:fall linear forwards;opacity:.8}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(540deg)}}
/* box */
.gift{position:relative;width:190px;height:190px;margin:10px 0 30px;animation:float 3s ease-in-out infinite;filter:drop-shadow(0 0 30px #ff8fab88)}
@keyframes float{50%{transform:translateY(-12px)}}
.gift .base{position:absolute;bottom:0;left:10px;right:10px;height:120px;background:linear-gradient(#ff5d8f,#c9184a);border-radius:8px}
.gift .lid{position:absolute;top:42px;left:0;right:0;height:42px;background:linear-gradient(#ff7aa2,#e0306a);border-radius:8px;transition:transform 1s cubic-bezier(.3,1.6,.5,1),opacity 1s}
.gift .rib{position:absolute;left:50%;width:30px;margin-left:-15px;background:var(--gold);top:0;bottom:0;transition:opacity .6s}
.gift .base .rib,.gift .lid .rib{height:100%}
.bow{position:absolute;top:14px;left:50%;margin-left:-35px;width:70px;height:36px;transition:transform 1s,opacity .8s;font-size:44px;line-height:36px}
.open .lid{transform:translate(70px,-160px) rotate(35deg);opacity:0}.open .bow{transform:translateY(-70px) rotate(-30deg);opacity:0}.open .rib{opacity:0}
.rays{position:absolute;left:50%;top:80px;width:600px;height:600px;margin:-300px 0 0 -300px;background:conic-gradient(from 0deg,#ffd27d55 0 8deg,transparent 8deg 30deg,#ffd27d55 30deg 38deg,transparent 38deg 60deg,#ffd27d55 60deg 68deg,transparent 68deg 90deg,#ffd27d55 90deg 98deg,transparent 98deg 120deg,#ffd27d55 120deg 128deg,transparent 128deg 150deg,#ffd27d55 150deg 158deg,transparent 158deg 180deg,#ffd27d55 180deg 188deg,transparent 188deg 210deg,#ffd27d55 210deg 218deg,transparent 218deg 240deg,#ffd27d55 240deg 248deg,transparent 248deg 270deg,#ffd27d55 270deg 278deg,transparent 278deg 300deg,#ffd27d55 300deg 308deg,transparent 308deg 330deg,#ffd27d55 330deg 338deg,transparent 338deg);border-radius:50%;opacity:0;pointer-events:none;-webkit-mask:radial-gradient(circle,#000,transparent 70%);mask:radial-gradient(circle,#000,transparent 70%)}
.open .rays{opacity:1;animation:spin 8s linear infinite;transition:opacity 1s}
@keyframes spin{to{transform:rotate(360deg)}}
.star{position:absolute;width:3px;height:3px;background:#fff;border-radius:50%;animation:tw 2s infinite alternate}
@keyframes tw{to{opacity:.15}}
/* heart + bow */
#heart{width:min(58vw,250px);animation:beat 1.1s infinite;filter:drop-shadow(0 10px 20px #c9184a55)}
@keyframes beat{15%{transform:scale(1.08)}30%{transform:scale(1)}45%{transform:scale(1.05)}}
#archery{width:min(70vw,260px);touch-action:none;overflow:visible;margin-top:60px;cursor:grab}
.shake{animation:shk .4s}@keyframes shk{20%{transform:translate(-8px,4px)}40%{transform:translate(8px,-4px)}60%{transform:translate(-5px,2px)}}
/* cinematic */
.frame{height:100dvh;aspect-ratio:9/16;max-width:100vw;background:radial-gradient(circle,#a30f26,#5c0615);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:30px;transform:scale(1.15);transition:transform 8s linear}
.show .frame{transform:scale(1)}
.bar{position:absolute;left:0;right:0;height:12vh;background:#000;transition:transform 1.4s;z-index:2}
#bt{top:0;transform:translateY(-100%)}#bb{bottom:0;transform:translateY(100%)}
.show .bar{transform:none}
.fade{opacity:0;transition:opacity 2s}.fade.in{opacity:1}
.cine{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:clamp(24px,7vw,34px);line-height:1.4}
/* stickman */
#stage{position:relative;width:min(100%,420px);flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
#bubble{position:relative;background:#fff;color:var(--ink);font:700 clamp(19px,5vw,25px)/1.25 Caveat,cursive;padding:16px 20px;border-radius:22px;border:3px solid var(--ink);max-width:92%;min-height:60px;margin-bottom:26px;box-shadow:4px 5px 0 #5a2a3a33;transform-origin:50% 100%}
#bubble:after{content:"";position:absolute;bottom:-17px;left:50%;margin-left:-12px;border:11px solid transparent;border-top:17px solid var(--ink)}
#bubble.pop{animation:pop .45s cubic-bezier(.3,1.8,.5,1)}@keyframes pop{from{transform:scale(.3);opacity:0}}
#man{width:170px;height:230px;overflow:visible;cursor:pointer;animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
#man line,#man circle.o{stroke:var(--ink);stroke-width:5;stroke-linecap:round;fill:none}
#armR{transform-origin:100px 100px;animation:wave .6s ease-in-out infinite alternate}
#armL{transform-origin:80px 100px;transition:transform .6s}
.hug #armL{transform:rotate(-135deg)}.hug #armR{animation:none;transform:rotate(135deg)}
@keyframes wave{to{transform:rotate(-30deg)}}
.talk #armR{animation:none}
#eyes{animation:blink 4s infinite;transform-origin:90px 62px}@keyframes blink{96%,100%{transform:scaleY(.1)}}
#blush{opacity:0;transition:opacity .4s}.shy #blush{opacity:.8}
#nav{margin:14px 0 4px;display:flex;gap:10px}
#grass{position:absolute;bottom:0;width:100%}
/* bouquet */
#bq{width:min(86vw,360px);overflow:visible}
.stem{stroke:#3f9142;stroke-width:5;fill:none;stroke-linecap:round;stroke-dasharray:300;stroke-dashoffset:300;transition:stroke-dashoffset 1.3s ease-out}
.fl{transform:scale(0);transition:transform .9s cubic-bezier(.3,1.7,.5,1);cursor:pointer}
.go .stem{stroke-dashoffset:0}.go .fl{transform:scale(1)}
.fl.sway{animation:sway .9s}@keyframes sway{25%{transform:rotate(14deg)}60%{transform:rotate(-10deg)}}
.cap{font-size:clamp(24px,6.5vw,32px);color:var(--ink);margin:6px 0 12px}
#note{position:fixed;left:50%;bottom:calc(var(--sab) + 80px);transform:translate(-50%,30px);background:#fffdf5;color:var(--ink);padding:14px 22px;border-radius:12px;font:700 24px Caveat;opacity:0;transition:.6s;pointer-events:none;z-index:45;box-shadow:0 6px 20px #0004;width:max-content;max-width:90vw}
#note.in{opacity:1;transform:translate(-50%,0)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.glow{font-size:80px;animation:beat 2s infinite;filter:drop-shadow(0 0 25px #ff4d79)}
@media (max-width:480px){
  html,body{overflow:hidden}
  .scene{padding:calc(var(--sat) + 8px) 12px calc(var(--sab) + 10px)}
  #s1{padding:16px 12px 24px}
  #s1 .preview-shell{width:100%;max-width:420px}
  #s1 .topbar{gap:8px;margin-bottom:12px}
  #s1 .nav-pill.back-pill{min-width:92px;padding:10px 12px;font-size:15px}
  #s1 .preview-tag{padding:8px 10px;font-size:11px;letter-spacing:1px}
  #s1 .speaker{width:42px;height:42px;font-size:20px}
  #s1 .mail-card{padding:16px 14px 12px;border-radius:14px}
  #s1 .mail-row{gap:8px;padding:0}
  #s1 .small-label{font-size:20px;letter-spacing:2px}
  #s1 #t1{font-size:clamp(40px,16vw,64px);padding-bottom:6px;margin-bottom:8px}
  #s1 .stamp{width:68px;height:68px;font-size:11px;letter-spacing:1px}
  #s1 .divider{margin:10px 0}
  #s1 .gift{position:absolute;top:18px;right:10px;width:82px;height:82px;transform:rotate(2deg)}
  #s1 .gift .base{left:9px;right:9px;height:52px}
  #s1 .gift .lid{top:22px;height:26px}
  #s1 .gift .bow{font-size:28px;width:44px;height:24px;margin-left:-22px;top:8px}
  #s1 .message-block{padding:8px 0 0}
  #s1 .message{font-size:clamp(20px,7vw,30px);max-width:100%;line-height:1.25}
  #s1 .message br{display:none}
  #s1 .signature{font-size:clamp(32px,12vw,46px);padding-top:8px}
  #s1 #unwrap{margin-top:18px;padding:17px 18px;font-size:18px;width:100%}
  #s2 .poem{font-size:clamp(28px,9vw,42px);padding:0 10px}
}
@media(prefers-reduced-motion:reduce){.gift,#man,.glow,#heart{animation:none}.frame{transition:none}}
</style></head><body>
<div id="loader">Wrapping your gift… 🎁</div>
<button id="mute" aria-label="Toggle music">🔊</button>
<div id="petals"></div>

<section class="scene" id="s1">
  <div class="preview-shell">
    <div class="topbar" style="display:none;">
      <button class="nav-pill back-pill" type="button">← Back</button>
      <div class="preview-tag">Preview</div>
      <button class="speaker" type="button" aria-label="Volume">◔</button>
    </div>

    <div class="mail-card">
      <div class="mail-row">
        <div class="to-wrap">
          <div class="small-label">TO</div>
          <h1 id="t1"></h1>
        </div>
        <div class="stamp-wrap">
          <div class="stamp">Today</div>
        </div>
      </div>

      <div class="divider"></div>
      <div class="divider"></div>

      <div class="gift" id="gift"><div class="base"><div class="rib"></div></div><div class="lid"><div class="rib"></div></div><div class="bow">🎀</div></div>

      <div class="message-block">
        <div class="message">Arshiya,<br>something is waiting for you.<br>Open it with the sound on.</div>
        <div class="signature">Arpit</div>
      </div>
    </div>

    <button class="btn" id="unwrap"></button>
  </div>
</section>

<section class="scene" id="s2"><div class="poem" id="poem"></div></section>

<section class="scene" id="s3"><div class="hand" style="font-size:28px;color:var(--deep);min-height:40px" id="hint"></div>
<svg id="heart" viewBox="0 0 100 100"><defs><radialGradient id="hg" cx="35%" cy="30%"><stop offset="0" stop-color="#ffc2d4"/><stop offset=".5" stop-color="#ff6b97"/><stop offset="1" stop-color="#d6336c"/></radialGradient></defs><path d="M50 90C8 60 4 30 25 17c14-8 25 2 25 11 0-9 11-19 25-11 21 13 17 43-25 73z" fill="url(#hg)"/><ellipse cx="30" cy="30" rx="9" ry="5" fill="#fff" opacity=".55" transform="rotate(-35 30 30)"/></svg>
<svg id="archery" viewBox="0 0 200 240"><path d="M15 110Q100 40 185 110" stroke="#8b5a3c" stroke-width="9" fill="none" stroke-linecap="round"/>
<line id="aim" x1="100" y1="110" x2="100" y2="-300" stroke="#c9184a" stroke-width="3" stroke-dasharray="3 12" stroke-linecap="round" opacity="0"/>
<path id="str" d="M15 110L100 110L185 110" stroke="#fff" stroke-width="3" fill="none"/>
<g id="arrow"><line x1="100" y1="110" x2="100" y2="-20" stroke="#8b5a3c" stroke-width="5" stroke-linecap="round"/><path d="M90 -14L100 -38L110 -14Z" fill="#c9184a"/><path d="M92 118L100 104L108 118M92 128L100 114L108 128" stroke="#ff8fab" stroke-width="3" fill="none"/></g></svg></section>

<section class="scene" id="s4"><div class="bar" id="bt"></div><div class="bar" id="bb"></div>
<div class="frame"><div class="cine fade" id="c1">I have missed you for so long…</div><div class="cine fade" id="c2">and now I don’t even know what to say.</div></div></section>

<section class="scene" id="s5"><div id="stage">
<div id="bubble"></div>
<svg id="man" viewBox="0 0 180 240"><g id="armL"><line x1="80" y1="100" x2="45" y2="140"/></g><g id="armR"><line x1="100" y1="100" x2="140" y2="55"/></g>
<circle class="o" cx="90" cy="62" r="36" fill="#fff"/><g id="eyes"><circle cx="77" cy="58" r="4" fill="#5a2a3a"/><circle cx="103" cy="58" r="4" fill="#5a2a3a"/></g>
<path id="mouth" d="M78 74Q90 86 102 74" stroke="#5a2a3a" stroke-width="4" fill="none" stroke-linecap="round"/>
<g id="blush"><circle cx="68" cy="70" r="7" fill="#ff8fab"/><circle cx="112" cy="70" r="7" fill="#ff8fab"/></g>
<line x1="90" y1="98" x2="90" y2="170"/><line x1="90" y1="170" x2="65" y2="225"/><line x1="90" y1="170" x2="115" y2="225"/></svg>
<div id="nav"><button class="btn" id="next">Next 💌</button></div></div></section>

<section class="scene" id="s6"><div class="hand cap" id="cap"></div>
<svg id="bq" viewBox="0 0 300 330"></svg>
<div class="row"><button class="btn ghost" id="smile">Open when you smile 💗</button><button class="btn" id="reply">Reply to Arpit 💌</button><button class="btn ghost" id="fin">Next ✨</button></div></section>
<div id="note"></div>



<section class="scene" id="s7"><div id="b7"></div><svg id="dm" viewBox="0 0 180 240"><circle class="o" cx="90" cy="62" r="34"/><circle cx="78" cy="58" r="4" fill="#ffd6e0"/><circle cx="102" cy="58" r="4" fill="#ffd6e0"/><path d="M78 74Q90 88 102 74" stroke="#ffd6e0" stroke-width="4" fill="none" stroke-linecap="round"/><line x1="90" y1="96" x2="90" y2="170"/><g class="dA"><line x1="90" y1="105" x2="50" y2="150"/></g><g class="dB"><line x1="90" y1="105" x2="130" y2="150"/></g><g class="dL"><line x1="90" y1="170" x2="65" y2="225"/></g><g class="dR"><line x1="90" y1="170" x2="115" y2="225"/></g></svg>
<div class="poem" id="q" style="margin:10px 0 16px">Can we start fresh? 🥹</div><div class="row" id="qb"><button class="btn" id="yes">Yes 💗</button><button class="btn ghost" id="no">No 🙈</button><button class="btn ghost" id="wm">What do you even mean? 🤨</button></div>
<div id="fin2" style="display:none;flex-direction:column;align-items:center"><div class="poem" id="end" style="margin:12px 0"></div><div class="row"><button class="btn" id="reply2">Reply to Arpit 💌</button><button class="btn ghost" id="replay">Replay 🔁</button></div></div></section>

<script>
/* ========= EDIT ME ========= */
const CFG={

const $=id=>document.getElementById(id),RM=matchMedia("(prefers-reduced-motion:reduce)").matches;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let cur=null,hearts=false;
async function go(n){const nx=$("s"+n);if(cur){cur.classList.remove("show");await sleep(700);cur.classList.remove("on")}
 nx.classList.add("on");nx.offsetHeight;nx.classList.add("show");cur=nx;(init[n]||(()=>{}))()}
async function type(el,txt,sp=55){el.textContent="";for(const ch of txt){el.textContent+=ch;await sleep(sp)}}
/* petals & particles */
function petal(){const p=document.createElement("div");p.className="petal";p.textContent=["🌸","🌷","💮","✨"][Math.random()*4|0];
 p.style.cssText=`left:${Math.random()*100}vw;font-size:${12+Math.random()*14}px;animation-duration:${7+Math.random()*6}s;--dx:${Math.random()*120-60}px`;
 $("petals").appendChild(p);setTimeout(()=>p.remove(),14000)}
setInterval(petal,RM?2500:900);
function burst(x,y,em,n=18,d=120){for(let i=0;i<n;i++){const e=document.createElement("div");e.textContent=em[i%em.length];
 e.style.cssText=`position:fixed;left:${x}px;top:${y}px;font-size:${14+Math.random()*16}px;pointer-events:none;z-index:60`;document.body.appendChild(e);
 const a=Math.random()*6.28,r=d*(.4+Math.random());e.animate([{transform:"translate(0,0) scale(.5)",opacity:1},{transform:`translate(${Math.cos(a)*r}px,${Math.sin(a)*r-60}px) scale(1.2)`,opacity:0}],{duration:1100+Math.random()*600,easing:"ease-out"}).onfinish=()=>e.remove()}}
/* audio */

function music(){if(musicOn)return;musicOn=true;
 if(!CFG.SONG_URL)return;
 song=new Audio(CFG.SONG_URL);song.loop=true;song.preload="auto";song.volume=0;song.crossOrigin="anonymous";
 song.play().then(()=>{let v=0;const iv=setInterval(()=>{v+=.02;song.volume=Math.min(v,.4);if(v>=.4)clearInterval(iv)},120);}).catch(()=>{song=null;});
}

1(){$("t1").innerHTML=CFG.t1;$("unwrap").textContent=CFG.unwrap},

6(){$("cap").innerHTML=CFG.cap+(fav?"<br><small>…with your favourite as the star ✨</small>":"");bouquet();setTimeout(()=>hearts=true,3500)},
7(){$("b7").classList.remove("pop");$("qb").style.display="";$("q").style.display="";$("fin2").style.display="none";nos=0;$("no").textContent="No 🙈";$("no").style.transform="";$("no").onclick=null}};

 const r=$("gift").getBoundingClientRect();burst(r.left+95,r.top+60,["💖","🌸","💗","✨","🎀"],34,230);await sleep(2600);go(2)};
/* arrow */
function armed(){const svg=$("archery"),ar=$("arrow");let sy=null,pull=0,done=false;
 const set=p=>{pull=p;ar.style.transform=`translateY(${p}px)`;$("str").setAttribute("d",`M15 110L100 ${110+p}L185 110`);$("aim").setAttribute("opacity",p>10?.7:0)};set(0);
 svg.onpointerdown=e=>{if(done)return;sy=e.clientY;svg.setPointerCapture(e.pointerId)};
 svg.onpointermove=e=>{if(sy!=null&&!done)set(Math.max(0,Math.min(100,(e.clientY-sy)*.8)))};
 svg.onpointerup=async()=>{if(sy==null||done)return;sy=null;if(pull<25){set(0);return}done=true;$("hint").textContent="";$("aim").setAttribute("opacity",0);
  $("str").setAttribute("d","M15 110L100 110L185 110");
  const h=$("heart").getBoundingClientRect(),a=svg.getBoundingClientRect(),dist=(a.top+40-(h.top+h.height/2))*(200/a.width);
  ar.animate([{transform:`translateY(${pull}px)`},{transform:`translateY(${-dist-20}px)`}],{duration:380,easing:"ease-in",fill:"forwards"});await sleep(340);
  navigator.vibrate&&navigator.vibrate(60);$("heart").animate([{transform:"scale(1.2,.8)"},{transform:"scale(1.5)",opacity:.9},{transform:"scale(0)",opacity:0}],{duration:260,fill:"forwards"});
  ar.style.display="none";burst(h.left+h.width/2,h.top+h.height/2,["💗","💖","🩷","💕","✨"],46,260);
  if(!RM){$("s3").classList.add("shake");setTimeout(()=>$("s3").classList.remove("shake"),400)}
  await sleep(1600);go(4)}}

const NS="http://www.w3.org/2000/svg";
function bouquet(){const s=$("bq");s.classList.remove("go");
 const F=[ // x,y,type,delay
 [150,70,"sun"],[85,105,"rose"],[215,105,"tulip"],[120,160,"lily"],[185,160,"rose"],[55,175,"tulip"],[245,175,"lily"]];if(fav)[0,3,4].forEach(i=>F[i][2]=fav);
 let h=`<g>`;F.forEach(([x,y],i)=>h+=`<path class="stem" style="transition-delay:${i*.25}s" d="M150 275Q${(x+150)/2} ${(y+275)/2+20} ${x} ${y}"/>`);
 for(let i=0;i<14;i++){const x=70+Math.random()*160,y=95+Math.random()*80;h+=`<path class="stem" style="stroke:#7fbf7a;stroke-width:2;transition-delay:${1.5+i*.05}s" d="M150 275Q${x} ${y+60} ${x} ${y}"/><circle class="fl" cx="${x}" cy="${y}" r="5" fill="#fff" style="transform-origin:${x}px ${y}px;transition-delay:${2+i*.08}s"/>`}
 F.forEach(([x,y,t],i)=>{h+=`<g class="fl" style="transform-origin:${x}px ${y+30}px;transition-delay:${i*.25+1}s" data-x="${x}" data-y="${y}"><g transform="translate(${x},${y})">${head(t)}</g></g>`});
 h+=`<path d="M150 262c-30-20-45 5-20 14l20-10 20 10c25-9 10-34-20-14z" fill="#ff5d8f"/><path d="M150 270l-14 50M150 270l14 50" stroke="#ff5d8f" stroke-width="6" stroke-linecap="round"/><circle cx="150" cy="268" r="8" fill="#c9184a"/></g>`;
 s.innerHTML=h;setTimeout(()=>s.classList.add("go"),100);
 s.querySelectorAll("g.fl").forEach(g=>g.onclick=e=>{e.stopPropagation();g.classList.remove("sway");g.getBoundingClientRect();g.classList.add("sway");const r=g.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,["🌸","🌺","🌷"],8,80)})}
function head(t){let o="";
 if(t=="sun"){for(let i=0;i<14;i++)o+=`<ellipse cx="0" cy="-24" rx="7" ry="14" fill="#ffc300" transform="rotate(${i*25.7})"/>`;o+=`<circle r="14" fill="#7a4a1e"/>`}
 if(t=="rose"){o=`<circle r="22" fill="#d90429"/><circle r="15" fill="#ef233c"/><path d="M-9 0a9 9 0 1 1 9 9" stroke="#8d0a1f" stroke-width="3" fill="none"/><circle r="5" fill="#8d0a1f"/>`}
 if(t=="tulip"){o=`<path d="M-18-10Q-20 20 0 22Q20 20 18-10L8 4L0-18L-8 4Z" fill="#ff7096"/><path d="M-8 4L0-18L8 4Q0 22 -8 4Z" fill="#ff9eb5"/>`}
 if(t=="lily"){for(let i=0;i<6;i++)o+=`<path d="M0 0Q-10-18 0-30Q10-18 0 0Z" fill="#fff0f5" stroke="#ffb3c8" stroke-width="1.5" transform="rotate(${i*60})"/>`;o+=`<circle r="4" fill="#ffd166"/>`}
 return o}
